# Developer version of configurations

server:
  port: 8086

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/auth_app
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

    hikari:
      pool-name: HikariCP
      maximum-pool-size: 5
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
      validation-timeout: 1800000
      leak-detection-threshold: 0
      initialization-failed-timeout: -1

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:test-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:test-client-secret}
            scope:
              - openid
              - profile
              - email

          github:
            client-id: ${GITHUB_CLIENT_ID:test-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:test-client-secret}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - read:user
              - user:email

  jpa:
    show-sql: true

    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.security: DEBUG

security:
  jwt:
    secret: ${JWT_SECRET:mySuperSecretKeyForJwtTokenGeneration123456789}
    issuer: ${ISSUER:api.substring.com}

    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:600}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:86400}

    refresh-token-cookie-name: ${JWT_REFRESH_COOKIE_NAME:refreshToken}

    cookie-secure: false
    cookie-http-only: true
    cookie-same-site: lax
    cookie-domain:



app:
  cors:
    front-end-url: ${FRONTEND_URL:http://localhost:5173}

  auth:
    frontend:
      success-redirect: ${FRONT_END_SUCCESS_URL:http://localhost:5173/auth/success}
      failure-redirect: ${FRONT_END_SUCCESS_URL:http://localhost:5173/auth/failure}